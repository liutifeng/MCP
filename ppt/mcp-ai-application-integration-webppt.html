<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>面向 AI 应用集成的 MCP 与网关</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ===========================================
       CSS CUSTOM PROPERTIES (THEME)
       =========================================== */
    :root {
      --stage-bg: #0d1117;
      --slide-bg: #f4f7f1;
      --paper: #fcfff7;
      --paper-2: #e8efe5;
      --ink: #17202a;
      --muted: #59636f;
      --faint: rgba(23, 32, 42, .07);
      --rule: rgba(23, 32, 42, .16);
      --heavy: rgba(23, 32, 42, .62);
      --red: #c6543d;
      --red-soft: rgba(198, 84, 61, .12);
      --blue: #1f6f8b;
      --blue-soft: rgba(31, 111, 139, .12);
      --cyan: #28a6b7;
      --cyan-soft: rgba(40, 166, 183, .12);
      --olive: #627d43;
      --olive-soft: rgba(98, 125, 67, .12);
      --gold: #b4872e;
      --gold-soft: rgba(180, 135, 46, .14);
      --violet: #7762a8;
      --violet-soft: rgba(119, 98, 168, .12);
      --card-shadow: 0 18px 42px rgba(18, 25, 38, .10);
      --font-display: "Noto Sans SC", sans-serif;
      --font-body: "Noto Sans SC", sans-serif;
      --font-mono: "IBM Plex Mono", monospace;
      --ease-out-expo: cubic-bezier(.16, 1, .3, 1);
      --duration-normal: .38s;
    }

    /* ===========================================
       BASE RESET
       =========================================== */
    * { box-sizing: border-box; }
    body { color: var(--ink); font-family: var(--font-body); }
    button { font-family: inherit; }

    /* ===========================================
       FIXED 16:9 STAGE: MANDATORY BASE STYLES
       Include this ENTIRE file in every presentation.
       Slides are authored at 1920×1080 and scaled as a whole.
       =========================================== */

    /* 1. Lock the browser viewport */
    html,
    body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--stage-bg, #000);
    }

    /* 2. Full-window deck viewport */
    .deck-viewport {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: var(--stage-bg, #000);
    }

    /* 3. Fixed 16:9 design canvas.
       JavaScript sets transform: translate(...) scale(...). */
    .deck-stage {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        transform-origin: 0 0;
        background: var(--slide-bg, #fff);
    }

    /* 4. Slides stack inside the fixed stage.
       Content must be laid out at 1920×1080, not reflowed per device. */
    .slide {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        display: block;
        visibility: hidden;
        opacity: 0;
        pointer-events: none;
        background: var(--slide-bg, #fff);
    }

    .slide.active,
    .slide.visible {
        visibility: visible;
        opacity: 1;
        pointer-events: auto;
        z-index: 1;
    }

    /* 5. Keep media inside authored slide bounds */
    img,
    video,
    canvas,
    svg {
        max-width: 100%;
        max-height: 100%;
    }

    /* 6. Presentation chrome stays outside the slide design system */
    .deck-controls {
        position: fixed;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%);
        z-index: 1000;
    }

    /* 7. Print one fixed-size slide per page */
    @media print {
        html,
        body {
            width: 1920px;
            height: auto;
            overflow: visible;
            background: #fff;
        }

        .deck-viewport {
            position: static;
            overflow: visible;
            background: #fff;
        }

        .deck-stage {
            position: static;
            width: auto;
            height: auto;
            transform: none !important;
            background: none;
        }

        .slide {
            position: relative;
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
            pointer-events: auto !important;
            width: 1920px;
            height: 1080px;
            break-after: page;
            page-break-after: always;
        }

        .slide:last-child {
            break-after: auto;
            page-break-after: auto;
        }

        .deck-controls {
            display: none !important;
        }
    }

    /* 8. Reduced motion */
    @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
            animation-duration: 0.01ms !important;
            transition-duration: 0.2s !important;
        }
    }

    /* ===========================================
       REPORT STAGE
       =========================================== */
    .deck-stage {
      box-shadow: 0 30px 90px rgba(0, 0, 0, .38);
    }

    .slide {
      padding: 74px 92px;
      background:
        linear-gradient(118deg, transparent 0 62%, rgba(40,166,183,.10) 62% 64%, transparent 64% 100%),
        linear-gradient(24deg, transparent 0 70%, rgba(180,135,46,.10) 70% 72%, transparent 72% 100%),
        linear-gradient(90deg, rgba(23,32,42,.045) 0 1px, transparent 1px 100%),
        linear-gradient(0deg, rgba(23,32,42,.035) 0 1px, transparent 1px 100%),
        linear-gradient(180deg, #f9fbf4, #edf2ea);
      background-size: auto, auto, 80px 80px, 80px 80px, auto;
    }

    .slide.reverse {
      --slide-bg: #f4f7f1;
      --ink: #17202a;
      --muted: #59636f;
      --rule: rgba(23, 32, 42, .16);
      --heavy: rgba(23, 32, 42, .62);
      color: var(--ink);
      background:
        linear-gradient(116deg, transparent 0 56%, rgba(40,166,183,.13) 56% 58%, transparent 58% 100%),
        linear-gradient(28deg, transparent 0 70%, rgba(198,84,61,.09) 70% 72%, transparent 72% 100%),
        linear-gradient(90deg, rgba(23,32,42,.045) 0 1px, transparent 1px 100%),
        linear-gradient(0deg, rgba(23,32,42,.035) 0 1px, transparent 1px 100%),
        linear-gradient(180deg, #f9fbf4, #edf2ea);
      background-size: auto, auto, 80px 80px, 80px 80px, auto;
    }

    .slide::before {
      content: "";
      position: absolute;
      left: 92px;
      right: 92px;
      top: 48px;
      height: 2px;
      background: linear-gradient(90deg, var(--module-color, var(--blue)) 0 160px, var(--rule) 160px 100%);
    }

    .slide::after {
      content: attr(data-folio);
      position: absolute;
      right: 92px;
      top: 48px;
      color: var(--muted);
      font: 600 17px/1 var(--font-mono);
      letter-spacing: 0;
      background: color-mix(in srgb, var(--slide-bg) 86%, transparent);
      border: 1px solid var(--rule);
      padding: 9px 12px;
      text-align: right;
    }

    .slide.reverse::after { color: var(--muted); }

    /* ===========================================
       TYPOGRAPHY
       =========================================== */
    h1, h2, h3, p { margin: 0; }
    h1, h2 { font-family: var(--font-display); letter-spacing: 0; }
    h1 { font-size: 92px; line-height: 1.06; font-weight: 800; }
    h2 { font-size: 62px; line-height: 1.12; font-weight: 800; max-width: 1380px; }
    h3 { font-size: 32px; line-height: 1.2; font-weight: 700; }
    p, li { font-size: 26px; line-height: 1.46; }
    .lead { color: var(--muted); font-size: 30px; line-height: 1.45; max-width: 1240px; margin-top: 22px; }
    .reverse .lead, .reverse .muted { color: var(--muted); }
    .label {
      display: inline-block;
      color: var(--blue);
      font: 800 18px/1 var(--font-body);
      letter-spacing: 0;
      border: 1px solid color-mix(in srgb, currentColor 36%, transparent);
      border-left: 8px solid currentColor;
      padding: 10px 14px 10px 13px;
      background: color-mix(in srgb, currentColor 9%, transparent);
      margin-bottom: 22px;
    }
    .reverse .label { background: color-mix(in srgb, var(--blue) 9%, transparent); color: var(--blue); }
    .mono { font-family: var(--font-mono); }
    .red { color: var(--red); }
    .blue { color: var(--blue); }
    .module-bar {
      position: absolute;
      left: 92px;
      top: 48px;
      z-index: 4;
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font: 600 17px/1 var(--font-body);
      background: color-mix(in srgb, var(--slide-bg) 86%, transparent);
      border: 1px solid var(--rule);
      border-left: 8px solid var(--module-color, var(--blue));
      padding: 9px 14px 9px 12px;
    }
    .module-index {
      color: var(--blue);
      font: 700 16px/1 var(--font-mono);
    }
    .module-title { color: var(--ink); }
    .module-pages {
      color: var(--muted);
      font: 600 15px/1 var(--font-mono);
    }
    .module-1 { --module-color: #1f6f8b; }
    .module-2 { --module-color: #627d43; }
    .module-3 { --module-color: #b4872e; }
    .module-4 { --module-color: #7762a8; }
    .module-5 { --module-color: #c6543d; }
    .module-1 .module-index,
    .module-2 .module-index,
    .module-3 .module-index,
    .module-4 .module-index,
    .module-5 .module-index {
      color: var(--module-color);
    }
    .module-1 .quote,
    .module-2 .quote,
    .module-3 .quote,
    .module-4 .quote,
    .module-5 .quote {
      border-left-color: var(--module-color);
    }
    .module-1 .agenda-num, .module-2 .agenda-num, .module-3 .agenda-num, .module-4 .agenda-num, .module-5 .agenda-num {
      color: var(--module-color);
    }

    /* ===========================================
       ANIMATIONS
       =========================================== */
    .reveal {
      opacity: 0;
      transform: translateY(14px);
      transition: opacity var(--duration-normal) var(--ease-out-expo),
                  transform var(--duration-normal) var(--ease-out-expo);
    }

    .slide.visible .reveal {
      opacity: 1;
      transform: translateY(0);
    }

    .reveal:nth-child(1),
    .reveal:nth-child(2),
    .reveal:nth-child(3),
    .reveal:nth-child(4),
    .reveal:nth-child(5) {
      transition-delay: 0s;
    }

    /* ===========================================
       LAYOUT SYSTEM
       =========================================== */
    .frame {
      position: relative;
      z-index: 2;
      height: 100%;
      display: grid;
      gap: 38px;
    }
    .title-frame { grid-template-columns: 1.05fr .95fr; align-items: center; gap: 70px; }
    .cover-frame {
      align-content: center;
      justify-items: center;
      text-align: center;
    }
    .cover-frame > div { transform: translateY(-80px); }
    .cover-frame h1 {
      max-width: none;
      white-space: nowrap;
      font-size: 82px;
    }
    .cover-speaker {
      color: var(--muted);
      font: 700 32px/1.2 var(--font-body);
      margin-top: 28px;
    }
    .stack-frame { grid-template-rows: auto 1fr; }
    .split-frame { grid-template-columns: .9fr 1.1fr; align-items: stretch; gap: 48px; }
    .center-frame { align-content: center; gap: 32px; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
    .four { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
    .five { display: grid; grid-template-columns: repeat(5, 1fr); gap: 18px; }
    .summary-points { display: grid; gap: 16px; margin-top: 34px; }
    .summary-points .tile { min-height: 128px; }

    /* ===========================================
       DOCUMENT COMPONENTS
       =========================================== */
    .sheet, .tile, .stamp, .quote, .table, .ledger {
      border: 1px solid var(--rule);
      background: rgba(252,255,247,.80);
      box-shadow: var(--card-shadow);
      backdrop-filter: blur(8px);
    }
    .reverse .sheet, .reverse .tile, .reverse .stamp, .reverse .quote, .reverse .table, .reverse .ledger {
      border-color: var(--rule);
      background: rgba(252,255,247,.82);
      box-shadow: var(--card-shadow);
    }
    .sheet { padding: 30px; }
    .tile {
      position: relative;
      padding: 28px;
      min-height: 164px;
      overflow: hidden;
    }
    .tile::before, .sheet::before, .table::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 5px;
      background: linear-gradient(90deg, var(--module-color, var(--blue)), transparent);
    }
    .sheet, .table { position: relative; overflow: hidden; }
    .tile strong, .stamp strong {
      display: block;
      font-size: 30px;
      line-height: 1.22;
      margin-bottom: 12px;
    }
    .tile span, .stamp span {
      display: block;
      color: var(--muted);
      font-size: 23px;
      line-height: 1.38;
    }
    .reverse .tile span, .reverse .stamp span { color: var(--muted); }
    .quote {
      padding: 34px 38px;
      border-left: 8px solid var(--blue);
      font: 700 34px/1.42 var(--font-display);
      background: rgba(252,255,247,.80);
    }
    .list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 14px;
    }
    .list li {
      display: grid;
      grid-template-columns: 38px 1fr;
      color: var(--muted);
      align-items: start;
    }
    .reverse .list li { color: var(--muted); }
    .list li::before {
      content: "";
      width: 7px;
      height: 7px;
      margin-top: 15px;
      background: var(--module-color, var(--blue));
      box-shadow: 0 0 0 6px color-mix(in srgb, var(--module-color, var(--blue)) 12%, transparent);
    }
    .ribbon {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .tag {
      border: 1px solid var(--rule);
      background: rgba(252,255,247,.78);
      padding: 12px 15px;
      font: 600 20px/1 var(--font-body);
      color: var(--ink);
    }
    .reverse .tag { color: var(--ink); border-color: var(--rule); background: rgba(252,255,247,.78); }

    /* ===========================================
       DIAGRAMS
       =========================================== */
    .cover-map {
      position: relative;
      height: 700px;
      border: 1px solid var(--rule);
      background:
        linear-gradient(120deg, transparent 0 45%, rgba(40,166,183,.18) 45% 46%, transparent 46% 100%),
        linear-gradient(34deg, transparent 0 58%, rgba(198,84,61,.14) 58% 59%, transparent 59% 100%),
        linear-gradient(90deg, rgba(244,239,229,.10) 1px, transparent 1px),
        linear-gradient(0deg, rgba(244,239,229,.08) 1px, transparent 1px),
        rgba(255,255,255,.055);
      background-size: auto, auto, 52px 52px, 52px 52px, auto;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.05), 0 26px 70px rgba(0,0,0,.24);
    }
    .map-node {
      position: absolute;
      border: 1px solid var(--rule);
      background: rgba(246,243,236,.92);
      padding: 20px 18px;
      font: 700 23px/1.1 var(--font-body);
      min-width: 144px;
      text-align: center;
      color: #17202a;
      box-shadow: 0 15px 30px rgba(0,0,0,.18);
    }
    .map-node.redbox { border-color: rgba(198,84,61,.54); color: #17202a; background: #ffe9df; }
    .map-node.bluebox { border-color: rgba(40,166,183,.54); color: #17202a; background: #e5fbff; }
    .map-line {
      position: absolute;
      height: 3px;
      background: linear-gradient(90deg, rgba(40,166,183,.88), rgba(180,135,46,.72));
      transform-origin: left center;
      box-shadow: 0 0 16px rgba(40,166,183,.36);
    }
    .agent { left: 54px; top: 318px; }
    .mcp { left: 226px; top: 318px; }
    .gateway { left: 398px; top: 318px; }
    .tools { right: 44px; top: 128px; }
    .resources { right: 44px; top: 318px; }
    .systems { right: 44px; top: 508px; }
    .l1 { left: 198px; top: 352px; width: 32px; }
    .l2 { left: 370px; top: 352px; width: 32px; }
    .l3 { left: 542px; top: 352px; width: 95px; transform: rotate(-56deg); }
    .l4 { left: 542px; top: 352px; width: 78px; }
    .l5 { left: 542px; top: 352px; width: 96px; transform: rotate(56deg); }
    .agenda-item {
      min-height: 440px;
      display: grid;
      align-content: start;
      gap: 18px;
      background:
        linear-gradient(180deg, color-mix(in srgb, var(--module-color, var(--blue)) 13%, transparent), transparent 44%),
        rgba(252,255,247,.84);
    }
    .agenda-item span {
      color: var(--muted);
      font-size: 22px;
      line-height: 1.35;
    }
    .agenda-num {
      font: 700 64px/1 var(--font-mono);
      color: var(--blue);
    }
    .flow {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 18px;
      align-items: center;
    }
    .role-flow {
      grid-template-columns: 1fr 54px 1fr 54px 1fr 54px 1fr;
    }
    .sequence-flow {
      grid-template-columns: repeat(6, 1fr);
    }
    .flow .tile {
      min-height: 150px;
      text-align: center;
      display: grid;
      place-content: center;
    }
    .arrow {
      height: 2px;
      background: linear-gradient(90deg, var(--module-color, var(--blue)), var(--heavy));
      position: relative;
    }
    .arrow::after {
      content: "";
      position: absolute;
      right: -2px;
      top: -7px;
      border-left: 15px solid var(--module-color, var(--blue));
      border-top: 8px solid transparent;
      border-bottom: 8px solid transparent;
    }
    .reverse .arrow { background: linear-gradient(90deg, var(--module-color, var(--cyan)), var(--heavy)); }
    .reverse .arrow::after { border-left-color: var(--module-color, var(--cyan)); }
    .roles-layout {
      display: grid;
      grid-template-columns: 1.08fr .72fr;
      gap: 34px;
      align-items: stretch;
    }
    .roles-diagram {
      position: relative;
      min-height: 610px;
      border: 1px solid var(--rule);
      background:
        linear-gradient(90deg, rgba(40,166,183,.08) 1px, transparent 1px),
        linear-gradient(0deg, rgba(40,166,183,.06) 1px, transparent 1px),
        rgba(252,255,247,.82);
      background-size: 44px 44px, 44px 44px, auto;
      box-shadow: var(--card-shadow);
      overflow: hidden;
    }
    .roles-diagram::before {
      content: "";
      position: absolute;
      inset: 42px;
      border: 1px solid rgba(23,32,42,.08);
      pointer-events: none;
    }
    .role-node {
      position: absolute;
      z-index: 3;
      min-width: 106px;
      padding: 14px 13px;
      border: 1.5px solid rgba(31,111,139,.74);
      background: rgba(252,255,247,.96);
      box-shadow: 0 15px 30px rgba(23,32,42,.12);
      text-align: center;
      color: var(--ink);
    }
    .role-node strong {
      display: block;
      font: 800 18px/1.16 var(--font-body);
    }
    .role-node span {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font: 600 14px/1.22 var(--font-body);
    }
    .role-node.host {
      min-width: 146px;
      border-color: rgba(198,84,61,.76);
      background: #fff1ea;
    }
    .role-node.client {
      min-width: 138px;
      border-color: rgba(40,166,183,.82);
      background: #e9fbff;
    }
    .role-node.server {
      min-width: 148px;
      border-color: rgba(180,135,46,.82);
      background: #fff6df;
    }
    .role-node.system {
      min-width: 162px;
    }
    .role-user { left: 54px; top: 284px; }
    .role-host { left: 210px; top: 270px; }
    .role-model { left: 462px; top: 145px; }
    .role-client { left: 462px; top: 416px; }
    .role-server { left: 636px; top: 416px; }
    .role-system { left: 820px; top: 416px; }
    .role-edge {
      position: absolute;
      z-index: 2;
      height: 2px;
      background: linear-gradient(90deg, rgba(31,111,139,.72), rgba(40,166,183,.90));
      transform-origin: left center;
      box-shadow: 0 0 10px rgba(40,166,183,.18);
    }
    .role-edge::after {
      content: "";
      position: absolute;
      right: -2px;
      top: -6px;
      border-left: 12px solid rgba(31,111,139,.88);
      border-top: 7px solid transparent;
      border-bottom: 7px solid transparent;
    }
    .role-edge.bidirectional::before {
      content: "";
      position: absolute;
      left: -2px;
      top: -6px;
      border-right: 12px solid rgba(31,111,139,.88);
      border-top: 7px solid transparent;
      border-bottom: 7px solid transparent;
    }
    .role-edge.e-user-host { left: 160px; top: 310px; width: 48px; }
    .role-edge.e-host-model { left: 350px; top: 276px; width: 140px; transform: rotate(-39deg); }
    .role-edge.e-host-client { left: 350px; top: 334px; width: 140px; transform: rotate(39deg); }
    .role-edge.e-client-server { left: 600px; top: 454px; width: 40px; }
    .role-edge.e-server-system { left: 786px; top: 454px; width: 38px; transform: none; }
    .roles-cards {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }
    .roles-cards .tile {
      min-height: 196px;
      display: grid;
      align-content: start;
    }
    .roles-cards .tile strong {
      font-size: 32px;
      margin-bottom: 16px;
    }
    .roles-cards .tile span {
      font-size: 23px;
      line-height: 1.42;
    }
    .sequence-diagram {
      --sequence-blue: #1f6f8b;
      position: relative;
      height: 690px;
      padding: 0;
      overflow: hidden;
      background: rgba(252,255,247,.90);
    }
    .sequence-diagram::before { display: none; }
    .mermaid-sequence {
      --c1: 5.5%;
      --c2: 34%;
      --c3: 59%;
      --c4: 70%;
      --c5: 81%;
      --c6: 94.5%;
      position: absolute;
      inset: 20px 28px 20px;
    }
    .seq-participant {
      position: absolute;
      width: 158px;
      height: 58px;
      display: grid;
      place-items: center;
      border: 1.7px solid var(--sequence-blue);
      border-radius: 3px;
      background: rgba(252,255,247,.94);
      color: var(--muted);

    /* ===========================================
       SLIDE PRESENTATION CONTROLLER
       =========================================== */
    class SlidePresentation {
      constructor() {
        this.stage = document.getElementById("deckStage");
        this.counter = document.getElementById("counter");
        this.progressBar = document.getElementById("progressBar");
        this.indexKey = "mcp-webppt-manual-current";
        this.editKey = "mcp-webppt-manual-edits";
        this.renderSlides();
        this.slides = [...document.querySelectorAll(".slide")];
        this.restoreEdits();
        this.setupStageScale();
        this.setupNavigation();
        this.setupTouch();
        this.setupWheel();
        this.setupEditing();
        const requested = Number.parseInt(new URLSearchParams(location.search).get("slide") || "", 10);
        const stored = Number.parseInt(localStorage.getItem(this.indexKey) || "0", 10);
        this.show(Number.isFinite(requested) ? requested - 1 : stored);
      }

      renderSlides() {
        this.stage.innerHTML = slidesData.map((s, i) => {
          const body = templates[s.type](s);
          const module = getModule(i);
          const moduleBar = module
            ? `<div class="module-bar"><span class="module-index">模块 ${String(module.id).padStart(2, "0")}</span><span class="module-title">${esc(module.title)}</span><span class="module-pages">${esc(module.pages)}</span></div>`
            : "";
          const cls = `${s.reverse ? "slide reverse" : "slide"}${module ? ` module-${module.id}` : ""}`;
          return `<section class="${cls}" data-folio="${esc(s.folio)}" aria-label="${i + 1}. ${esc(s.title)}">${moduleBar}${body}</section>`;
        }).join("");
      }

      setupStageScale() {
        const scale = () => {
          const factor = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
          const x = (window.innerWidth - 1920 * factor) / 2;
          const y = (window.innerHeight - 1080 * factor) / 2;
          this.stage.style.transform = `translate(${x}px, ${y}px) scale(${factor})`;
        };
        scale();
        window.addEventListener("resize", scale);
      }

      setupNavigation() {
        document.getElementById("prevBtn").addEventListener("click", () => this.go(-1));
        document.getElementById("nextBtn").addEventListener("click", () => this.go(1));
        document.addEventListener("keydown", (event) => {
          if (document.body.classList.contains("editing") && ["ArrowLeft", "ArrowRight", " "].includes(event.key)) return;
          if (["ArrowRight", " ", "PageDown"].includes(event.key)) { event.preventDefault(); this.go(1); }
          if (["ArrowLeft", "PageUp"].includes(event.key)) { event.preventDefault(); this.go(-1); }
          if (event.key === "Home") { event.preventDefault(); this.show(0); }
          if (event.key === "End") { event.preventDefault(); this.show(this.slides.length - 1); }
          if (event.key.toLowerCase() === "e" && !event.ctrlKey && !event.metaKey) { event.preventDefault(); this.toggleEdit(); }
          if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "s") { event.preventDefault(); this.saveEdits(true); }
        });
      }

      setupTouch() {
        let startX = 0, startY = 0;
        window.addEventListener("touchstart", (event) => {
          startX = event.changedTouches[0].clientX;
          startY = event.changedTouches[0].clientY;
        }, { passive: true });
        window.addEventListener("touchend", (event) => {
          const dx = event.changedTouches[0].clientX - startX;
          const dy = event.changedTouches[0].clientY - startY;
          if (Math.abs(dx) > 58 && Math.abs(dx) > Math.abs(dy)) this.go(dx < 0 ? 1 : -1);
        }, { passive: true });
      }

      setupWheel() {
        let locked = false;
        window.addEventListener("wheel", (event) => {
          if (locked || Math.abs(event.deltaY) < 30) return;
          locked = true;
          this.go(event.deltaY > 0 ? 1 : -1);
          setTimeout(() => locked = false, 440);
        }, { passive: true });
      }

      setupEditing() {
        const hotzone = document.getElementById("editHotzone");
        const toggle = document.getElementById("editToggle");
        let hideTimer;
        const show = () => { clearTimeout(hideTimer); toggle.classList.add("show"); };
        const hide = () => {
          clearTimeout(hideTimer);
          hideTimer = setTimeout(() => {
            if (!document.body.classList.contains("editing")) toggle.classList.remove("show");
          }, 400);
        };
        hotzone.addEventListener("mouseenter", show);
        hotzone.addEventListener("mouseleave", hide);
        toggle.addEventListener("mouseenter", show);
        toggle.addEventListener("mouseleave", hide);
        toggle.addEventListener("click", () => this.toggleEdit());
        this.stage.addEventListener("input", () => {
          if (document.body.classList.contains("editing")) this.saveEdits(false);
        });
      }

      toggleEdit() {
        const active = !document.body.classList.contains("editing");
        document.body.classList.toggle("editing", active);
        document.getElementById("editToggle").classList.toggle("active", active);
        document.querySelectorAll("[data-editable]").forEach((el) => {
          el.contentEditable = active ? "true" : "false";
        });
        if (!active) this.saveEdits(true);
      }

      saveEdits(signal) {
        const edits = [...document.querySelectorAll("[data-editable]")].map((el) => el.innerHTML);
        localStorage.setItem(this.editKey, JSON.stringify(edits));
        if (signal) {
          const old = this.counter.textContent;
          this.counter.textContent = "SAVED";
          setTimeout(() => this.updateChrome(), 720);
        }
      }

      restoreEdits() {
        try {
          const edits = JSON.parse(localStorage.getItem(this.editKey) || "[]");
          document.querySelectorAll("[data-editable]").forEach((el, i) => {
            if (edits[i]) el.innerHTML = edits[i];
          });
        } catch (_) {}
      }

      show(index) {
        this.current = Math.max(0, Math.min(index, this.slides.length - 1));
        this.slides.forEach((slide, i) => {
          slide.classList.toggle("active", i === this.current);
          slide.classList.toggle("visible", i === this.current);
        });
        localStorage.setItem(this.indexKey, String(this.current));
        this.updateChrome();
      }

      updateChrome() {
        this.counter.textContent = `${String(this.current + 1).padStart(2, "0")} / ${String(this.slides.length).padStart(2, "0")}`;
        this.progressBar.style.width = `${((this.current + 1) / this.slides.length) * 100}%`;
      }

      go(delta) { this.show(this.current + delta); }
    }

    new SlidePresentation();
  </script>
