<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>面向 AI 应用集成的 MCP 与网关</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ===========================================
       CSS CUSTOM PROPERTIES (THEME)
       =========================================== */
    :root {
      --stage-bg: #d7dce2;
      --slide-bg: #f8f9fb;
      --paper: #f8f9fb;
      --paper-2: #eef2f5;
      --ink: #202733;
      --muted: #657180;
      --faint: rgba(32, 39, 51, .07);
      --rule: rgba(32, 39, 51, .16);
      --heavy: rgba(32, 39, 51, .62);
      --red: #8c4b3f;
      --red-soft: rgba(140, 75, 63, .08);
      --blue: #3d648c;
      --blue-soft: rgba(61, 100, 140, .10);
      --olive: #6d7a68;
      --gold: #9b7b46;
      --font-display: "Noto Sans SC", sans-serif;
      --font-body: "Noto Sans SC", sans-serif;
      --font-mono: "IBM Plex Mono", monospace;
      --ease-out-expo: cubic-bezier(.16, 1, .3, 1);
      --duration-normal: .38s;
    }

    /* ===========================================
       BASE RESET
       =========================================== */
    * { box-sizing: border-box; }
    body { color: var(--ink); font-family: var(--font-body); }
    button { font-family: inherit; }

    /* ===========================================
       FIXED 16:9 STAGE: MANDATORY BASE STYLES
       Include this ENTIRE file in every presentation.
       Slides are authored at 1920×1080 and scaled as a whole.
       =========================================== */

    /* 1. Lock the browser viewport */
    html,
    body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--stage-bg, #000);
    }

    /* 2. Full-window deck viewport */
    .deck-viewport {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: var(--stage-bg, #000);
    }

    /* 3. Fixed 16:9 design canvas.
       JavaScript sets transform: translate(...) scale(...). */
    .deck-stage {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        transform-origin: 0 0;
        background: var(--slide-bg, #fff);
    }

    /* 4. Slides stack inside the fixed stage.
       Content must be laid out at 1920×1080, not reflowed per device. */
    .slide {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        display: block;
        visibility: hidden;
        opacity: 0;
        pointer-events: none;
        background: var(--slide-bg, #fff);
    }

    .slide.active,
    .slide.visible {
        visibility: visible;
        opacity: 1;
        pointer-events: auto;
        z-index: 1;
    }

    /* 5. Keep media inside authored slide bounds */
    img,
    video,
    canvas,
    svg {
        max-width: 100%;
        max-height: 100%;
    }

    /* 6. Presentation chrome stays outside the slide design system */
    .deck-controls {
        position: fixed;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%);
        z-index: 1000;
    }

    /* 7. Print one fixed-size slide per page */
    @media print {
        html,
        body {
            width: 1920px;
            height: auto;
            overflow: visible;
            background: #fff;
        }

        .deck-viewport {
            position: static;
            overflow: visible;
            background: #fff;
        }

        .deck-stage {
            position: static;
            width: auto;
            height: auto;
            transform: none !important;
            background: none;
        }

        .slide {
            position: relative;
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
            pointer-events: auto !important;
            width: 1920px;
            height: 1080px;
            break-after: page;
            page-break-after: always;
        }

        .slide:last-child {
            break-after: auto;
            page-break-after: auto;
        }

        .deck-controls {
            display: none !important;
        }
    }

    /* 8. Reduced motion */
    @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
            animation-duration: 0.01ms !important;
            transition-duration: 0.2s !important;
        }
    }

    /* ===========================================
       REPORT STAGE
       =========================================== */
    .deck-stage {
      box-shadow: 0 24px 70px rgba(35, 45, 60, .20);
    }

    .slide {
      padding: 74px 92px;
      background:
        linear-gradient(90deg, rgba(32,39,51,.035) 0 1px, transparent 1px 100%),
        linear-gradient(0deg, rgba(32,39,51,.026) 0 1px, transparent 1px 100%),
        linear-gradient(180deg, #fbfcfd, #f4f6f8);
      background-size: 80px 80px, 80px 80px, auto;
    }

    .slide.reverse {
      --slide-bg: #f1f4f7;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(32,39,51,.035) 0 1px, transparent 1px 100%),
        linear-gradient(0deg, rgba(32,39,51,.026) 0 1px, transparent 1px 100%),
        linear-gradient(180deg, #f3f6f8, #edf1f5);
      background-size: 80px 80px, 80px 80px, auto;
    }

    .slide::before {
      content: "";
      position: absolute;
      left: 92px;
      right: 92px;
      top: 48px;
      height: 1px;
      background: var(--rule);
    }

    .slide::after {
      content: attr(data-folio);
      position: absolute;
      right: 92px;
      top: 48px;
      color: var(--muted);
      font: 600 17px/1 var(--font-mono);
      letter-spacing: 0;
      background: var(--slide-bg);
      padding-left: 18px;
      text-align: right;
    }

    .slide.reverse::after { color: var(--muted); }

    /* ===========================================
       TYPOGRAPHY
       =========================================== */
    h1, h2, h3, p { margin: 0; }
    h1, h2 { font-family: var(--font-display); letter-spacing: 0; }
    h1 { font-size: 88px; line-height: 1.08; font-weight: 800; }
    h2 { font-size: 60px; line-height: 1.16; font-weight: 800; max-width: 1380px; }
    h3 { font-size: 32px; line-height: 1.2; font-weight: 700; }
    p, li { font-size: 26px; line-height: 1.46; }
    .lead { color: var(--muted); font-size: 30px; line-height: 1.45; max-width: 1230px; }
    .reverse .lead, .reverse .muted { color: var(--muted); }
    .label {
      display: inline-block;
      color: var(--blue);
      font: 700 18px/1 var(--font-body);
      letter-spacing: 0;
      border-left: 4px solid currentColor;
      padding: 0 0 0 12px;
      background: transparent;
    }
    .reverse .label { background: transparent; color: var(--blue); }
    .mono { font-family: var(--font-mono); }
    .red { color: var(--red); }
    .blue { color: var(--blue); }
    .module-bar {
      position: absolute;
      left: 92px;
      top: 48px;
      z-index: 4;
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font: 600 17px/1 var(--font-body);
      background: var(--slide-bg);
      padding-right: 18px;
    }
    .module-index {
      color: var(--blue);
      font: 700 16px/1 var(--font-mono);
    }
    .module-title {
      color: var(--ink);
    }
    .module-pages {
      color: var(--muted);
      font: 600 15px/1 var(--font-mono);
    }
    .module-1 { --module-color: #3d648c; }
    .module-2 { --module-color: #5d735d; }
    .module-3 { --module-color: #8c6a3d; }
    .module-4 { --module-color: #6a5f8c; }
    .module-5 { --module-color: #8c4b3f; }
    .module-1 .module-index,
    .module-2 .module-index,
    .module-3 .module-index,
    .module-4 .module-index,
    .module-5 .module-index {
      color: var(--module-color);
    }
    .module-1 .quote,
    .module-2 .quote,
    .module-3 .quote,
    .module-4 .quote,
    .module-5 .quote {
      border-left-color: var(--module-color);
    }

    /* ===========================================
       ANIMATIONS
       =========================================== */
    .reveal {
      opacity: 0;
      transform: translateY(14px);
      transition: opacity var(--duration-normal) var(--ease-out-expo),
                  transform var(--duration-normal) var(--ease-out-expo);
    }

    .slide.visible .reveal {
      opacity: 1;
      transform: translateY(0);
    }

    .reveal:nth-child(1) { transition-delay: .06s; }
    .reveal:nth-child(2) { transition-delay: .14s; }
    .reveal:nth-child(3) { transition-delay: .22s; }
    .reveal:nth-child(4) { transition-delay: .30s; }
    .reveal:nth-child(5) { transition-delay: .38s; }

    /* ===========================================
       LAYOUT SYSTEM
       =========================================== */
    .frame {
      position: relative;
      z-index: 2;
      height: 100%;
      display: grid;
      gap: 36px;
    }
    .title-frame { grid-template-columns: 1.05fr .95fr; align-items: center; gap: 70px; }
    .stack-frame { grid-template-rows: auto 1fr; }
    .split-frame { grid-template-columns: .9fr 1.1fr; align-items: stretch; gap: 48px; }
    .center-frame { align-content: center; gap: 32px; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
    .four { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
    .five { display: grid; grid-template-columns: repeat(5, 1fr); gap: 18px; }

    /* ===========================================
       DOCUMENT COMPONENTS
       =========================================== */
    .sheet, .tile, .stamp, .quote, .table, .ledger {
      border: 1px solid var(--rule);
      background: rgba(255,255,255,.72);
      box-shadow: none;
    }
    .reverse .sheet, .reverse .tile, .reverse .stamp, .reverse .quote, .reverse .table, .reverse .ledger {
      border-color: var(--rule);
      background: rgba(255,255,255,.62);
      box-shadow: none;
    }
    .sheet { padding: 30px; }
    .tile { padding: 26px; min-height: 160px; }
    .tile strong, .stamp strong {
      display: block;
      font-size: 29px;
      line-height: 1.22;
      margin-bottom: 12px;
    }
    .tile span, .stamp span {
      display: block;
      color: var(--muted);
      font-size: 23px;
      line-height: 1.38;
    }
    .reverse .tile span, .reverse .stamp span { color: var(--muted); }
    .quote {
      padding: 34px 38px;
      border-left: 5px solid var(--blue);
      font: 700 34px/1.42 var(--font-display);
      background: rgba(255,255,255,.72);
    }
    .list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 14px;
    }
    .list li {
      display: grid;
      grid-template-columns: 38px 1fr;
      color: var(--muted);
    }
    .reverse .list li { color: var(--muted); }
    .list li::before {
      content: "";
      width: 7px;
      height: 7px;
      margin-top: 15px;
      border-radius: 50%;
      background: var(--blue);
    }
    .ribbon {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .tag {
      border: 1px solid var(--rule);
      background: rgba(255,255,255,.68);
      padding: 11px 14px;
      font: 600 20px/1 var(--font-body);
      color: var(--ink);
    }
    .reverse .tag { color: var(--ink); border-color: var(--rule); background: rgba(255,255,255,.68); }

    /* ===========================================
       DIAGRAMS
       =========================================== */
    .cover-map {
      position: relative;
      height: 700px;
      border: 1px solid var(--rule);
      background:
        linear-gradient(90deg, rgba(32,39,51,.04) 1px, transparent 1px),
        linear-gradient(0deg, rgba(32,39,51,.035) 1px, transparent 1px),
        rgba(255,255,255,.42);
      background-size: 52px 52px, 52px 52px, auto;
    }
    .map-node {
      position: absolute;
      border: 1px solid var(--rule);
      background: rgba(255,255,255,.86);
      padding: 18px 18px;
      font: 700 23px/1.1 var(--font-body);
      min-width: 144px;
      text-align: center;
      color: var(--ink);
    }
    .map-node.redbox { border-color: rgba(140,75,63,.34); color: var(--ink); background: rgba(140,75,63,.06); }
    .map-node.bluebox { border-color: rgba(61,100,140,.38); color: var(--ink); background: var(--blue-soft); }
    .map-line {
      position: absolute;
      height: 2px;
      background: rgba(61,100,140,.50);
      transform-origin: left center;
    }
    .agent { left: 54px; top: 318px; }
    .mcp { left: 226px; top: 318px; }
    .gateway { left: 398px; top: 318px; }
    .tools { right: 44px; top: 128px; }
    .resources { right: 44px; top: 318px; }
    .systems { right: 44px; top: 508px; }
    .l1 { left: 198px; top: 352px; width: 32px; }
    .l2 { left: 370px; top: 352px; width: 32px; }
    .l3 { left: 542px; top: 352px; width: 95px; transform: rotate(-56deg); }
    .l4 { left: 542px; top: 352px; width: 78px; }
    .l5 { left: 542px; top: 352px; width: 96px; transform: rotate(56deg); }
    .agenda-item {
      min-height: 440px;
      display: grid;
      align-content: start;
      gap: 18px;
    }
    .agenda-item span {
      color: var(--muted);
      font-size: 22px;
      line-height: 1.35;
    }
    .agenda-num {
      font: 700 64px/1 var(--font-mono);
      color: var(--blue);
    }
    .flow {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 18px;
      align-items: center;
    }
    .flow .tile {
      min-height: 150px;
      text-align: center;
      display: grid;
      place-content: center;
      box-shadow: none;
    }
    .arrow {
      height: 2px;
      background: var(--heavy);
      position: relative;
    }
    .arrow::after {
      content: "";
      position: absolute;
      right: -2px;
      top: -7px;
      border-left: 15px solid var(--heavy);
      border-top: 8px solid transparent;
      border-bottom: 8px solid transparent;
    }
    .reverse .arrow { background: var(--heavy); }
    .reverse .arrow::after { border-left-color: var(--heavy); }
    .table { overflow: hidden; box-shadow: none; }
    .row {
      display: grid;
      grid-template-columns: .8fr 1.05fr 1.2fr;
    }
    .row > div {
      min-height: 94px;
      padding: 22px 24px;
      border-right: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
      color: var(--muted);
      font-size: 24px;
      line-height: 1.35;
    }
    .row > div:last-child { border-right: 0; }
    .row:last-child > div { border-bottom: 0; }
    .row.head > div {
      color: var(--ink);
      font-weight: 900;
      background: var(--blue-soft);
    }
    .reverse .row > div { color: var(--muted); border-color: var(--rule); }
    .reverse .row.head > div { color: var(--ink); background: var(--blue-soft); }
    .timeline {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
      align-items: end;
      height: 610px;
      border-bottom: 2px solid var(--heavy);
    }
    .phase {
      border: 1px solid var(--rule);
      background: rgba(255,255,255,.66);
      padding: 24px;
      display: grid;
      align-content: start;
      gap: 14px;
    }
    .phase:nth-child(1) { height: 250px; }
    .phase:nth-child(2) { height: 320px; }
    .phase:nth-child(3) { height: 390px; }
    .phase:nth-child(4) { height: 470px; border-color: rgba(140,75,63,.32); }
    .phase:nth-child(5) { height: 560px; border-color: rgba(61,100,140,.38); }
    .phase strong { font-size: 27px; line-height: 1.18; }
    .phase span { color: var(--muted); font-size: 21px; line-height: 1.35; }

    /* ===========================================
       PRESENTATION CHROME
       =========================================== */
    .deck-controls {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      border: 1px solid rgba(32,39,51,.18);
      background: rgba(255,255,255,.88);
      padding: 8px;
      box-shadow: 0 10px 30px rgba(35,45,60,.10);
    }
    .nav-button, .edit-toggle {
      width: 44px;
      height: 44px;
      border: 1px solid var(--rule);
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      font: 700 20px/1 var(--font-mono);
    }
    .nav-button:hover, .edit-toggle:hover { background: var(--blue-soft); }
    .counter {
      min-width: 96px;
      color: var(--muted);
      text-align: center;
      font: 700 15px/1 var(--font-mono);
    }
    .progress {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 4px;
      background: rgba(32,39,51,.10);
      z-index: 1000;
    }
    .progress span {
      display: block;
      width: 0;
      height: 100%;
      background: var(--blue);
      transition: width .3s var(--ease-out-expo);
    }
    .help {
      position: fixed;
      left: 20px;
      bottom: 24px;
      color: rgba(32,39,51,.50);
      z-index: 1000;
      font: 700 13px/1 var(--font-mono);
    }
    .edit-hotzone {
      position: fixed;
      left: 0;
      top: 0;
      width: 88px;
      height: 88px;
      z-index: 10000;
    }
    .edit-toggle {
      position: fixed;
      left: 20px;
      top: 20px;
      z-index: 10001;
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s ease;
    }
    .edit-toggle.show, .edit-toggle.active {
      opacity: 1;
      pointer-events: auto;
    }
    body.editing [data-editable] {
      outline: 2px dashed var(--blue);
      outline-offset: 4px;
      cursor: text;
    }
  </style>
</head>
<body>
  <div class="deck-viewport">
    <main class="deck-stage" id="deckStage"></main>
  </div>

  <div class="help">ARROWS / SPACE 翻页 · E 编辑</div>
  <div class="deck-controls" aria-label="幻灯片控制">
    <button class="nav-button" id="prevBtn" type="button" title="上一页">‹</button>
    <div class="counter" id="counter">01 / 18</div>
    <button class="nav-button" id="nextBtn" type="button" title="下一页">›</button>
  </div>
  <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>
  <div class="edit-hotzone" id="editHotzone"></div>
  <button class="edit-toggle" id="editToggle" type="button" title="编辑模式">E</button>

  <script>
    /* ===========================================

      { type: "split", folio: "03 / 背景", label: "背景", title: "AI 应用为什么需要连接外部世界", lead: "大模型只负责推理和生成，真实企业任务必须访问外部系统。", bullets: ["读项目文档", "查数据库", "调内部 API", "搜索知识库", "查看日志、指标、告警", "创建工单、发起审批"], quote: "企业 AI 应用的价值，往往来自“模型 + 企业上下文 + 外部动作”。" },

    /* ===========================================
       SLIDE PRESENTATION CONTROLLER
       =========================================== */
    class SlidePresentation {
      constructor() {
        this.stage = document.getElementById("deckStage");
        this.counter = document.getElementById("counter");
        this.progressBar = document.getElementById("progressBar");
        this.indexKey = "mcp-webppt-manual-current";
        this.editKey = "mcp-webppt-manual-edits";
        this.renderSlides();
        this.slides = [...document.querySelectorAll(".slide")];
        this.restoreEdits();
        this.setupStageScale();
        this.setupNavigation();
        this.setupTouch();
        this.setupWheel();
        this.setupEditing();
        const requested = Number.parseInt(new URLSearchParams(location.search).get("slide") || "", 10);
        const stored = Number.parseInt(localStorage.getItem(this.indexKey) || "0", 10);
        this.show(Number.isFinite(requested) ? requested - 1 : stored);
      }

      renderSlides() {
        this.stage.innerHTML = slidesData.map((s, i) => {
          const body = templates[s.type](s);
          const module = getModule(i);
          const moduleBar = module
            ? `<div class="module-bar"><span class="module-index">模块 ${String(module.id).padStart(2, "0")}</span><span class="module-title">${esc(module.title)}</span><span class="module-pages">${esc(module.pages)}</span></div>`
            : "";
          const cls = `${s.reverse ? "slide reverse" : "slide"}${module ? ` module-${module.id}` : ""}`;
          return `<section class="${cls}" data-folio="${esc(s.folio)}" aria-label="${i + 1}. ${esc(s.title)}">${moduleBar}${body}</section>`;
        }).join("");
      }

      setupStageScale() {
        const scale = () => {
          const factor = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
          const x = (window.innerWidth - 1920 * factor) / 2;
          const y = (window.innerHeight - 1080 * factor) / 2;
          this.stage.style.transform = `translate(${x}px, ${y}px) scale(${factor})`;
        };
        scale();
        window.addEventListener("resize", scale);
      }

      setupNavigation() {
        document.getElementById("prevBtn").addEventListener("click", () => this.go(-1));
        document.getElementById("nextBtn").addEventListener("click", () => this.go(1));
        document.addEventListener("keydown", (event) => {
          if (document.body.classList.contains("editing") && ["ArrowLeft", "ArrowRight", " "].includes(event.key)) return;
          if (["ArrowRight", " ", "PageDown"].includes(event.key)) { event.preventDefault(); this.go(1); }
          if (["ArrowLeft", "PageUp"].includes(event.key)) { event.preventDefault(); this.go(-1); }
          if (event.key === "Home") { event.preventDefault(); this.show(0); }
          if (event.key === "End") { event.preventDefault(); this.show(this.slides.length - 1); }
          if (event.key.toLowerCase() === "e" && !event.ctrlKey && !event.metaKey) { event.preventDefault(); this.toggleEdit(); }
          if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "s") { event.preventDefault(); this.saveEdits(true); }
        });
      }

      setupTouch() {
        let startX = 0, startY = 0;
        window.addEventListener("touchstart", (event) => {
          startX = event.changedTouches[0].clientX;
          startY = event.changedTouches[0].clientY;
        }, { passive: true });
        window.addEventListener("touchend", (event) => {
          const dx = event.changedTouches[0].clientX - startX;
          const dy = event.changedTouches[0].clientY - startY;
          if (Math.abs(dx) > 58 && Math.abs(dx) > Math.abs(dy)) this.go(dx < 0 ? 1 : -1);
        }, { passive: true });
      }

      setupWheel() {
        let locked = false;
        window.addEventListener("wheel", (event) => {
          if (locked || Math.abs(event.deltaY) < 30) return;
          locked = true;
          this.go(event.deltaY > 0 ? 1 : -1);
          setTimeout(() => locked = false, 440);
        }, { passive: true });
      }

      setupEditing() {
        const hotzone = document.getElementById("editHotzone");
        const toggle = document.getElementById("editToggle");
        let hideTimer;
        const show = () => { clearTimeout(hideTimer); toggle.classList.add("show"); };
        const hide = () => {
          clearTimeout(hideTimer);
          hideTimer = setTimeout(() => {
            if (!document.body.classList.contains("editing")) toggle.classList.remove("show");
          }, 400);
        };
        hotzone.addEventListener("mouseenter", show);
        hotzone.addEventListener("mouseleave", hide);
        toggle.addEventListener("mouseenter", show);
        toggle.addEventListener("mouseleave", hide);
        toggle.addEventListener("click", () => this.toggleEdit());
        this.stage.addEventListener("input", () => {
          if (document.body.classList.contains("editing")) this.saveEdits(false);
        });
      }

      toggleEdit() {
        const active = !document.body.classList.contains("editing");
        document.body.classList.toggle("editing", active);
        document.getElementById("editToggle").classList.toggle("active", active);
        document.querySelectorAll("[data-editable]").forEach((el) => {
          el.contentEditable = active ? "true" : "false";
        });
        if (!active) this.saveEdits(true);
      }

      saveEdits(signal) {
        const edits = [...document.querySelectorAll("[data-editable]")].map((el) => el.innerHTML);
        localStorage.setItem(this.editKey, JSON.stringify(edits));
        if (signal) {
          const old = this.counter.textContent;
          this.counter.textContent = "SAVED";
          setTimeout(() => this.updateChrome(), 720);
        }
      }

      restoreEdits() {
        try {
          const edits = JSON.parse(localStorage.getItem(this.editKey) || "[]");
          document.querySelectorAll("[data-editable]").forEach((el, i) => {
            if (edits[i]) el.innerHTML = edits[i];
          });
        } catch (_) {}
      }

      show(index) {
        this.current = Math.max(0, Math.min(index, this.slides.length - 1));
        this.slides.forEach((slide, i) => {
          slide.classList.toggle("active", i === this.current);
          slide.classList.toggle("visible", i === this.current);
        });
        localStorage.setItem(this.indexKey, String(this.current));
        this.updateChrome();
      }

      updateChrome() {
        this.counter.textContent = `${String(this.current + 1).padStart(2, "0")} / ${String(this.slides.length).padStart(2, "0")}`;
        this.progressBar.style.width = `${((this.current + 1) / this.slides.length) * 100}%`;
      }

      go(delta) { this.show(this.current + delta); }
    }

    new SlidePresentation();
  </script>
</body>
</html>
