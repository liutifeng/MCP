<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>面向 AI 应用集成的 MCP 与网关</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ===========================================
       CSS CUSTOM PROPERTIES (THEME)
       =========================================== */
    :root {
      --stage-bg: #0d1117;
      --slide-bg: #f4f7f1;
      --paper: #fcfff7;
      --paper-2: #e8efe5;
      --ink: #17202a;
      --muted: #59636f;
      --faint: rgba(23, 32, 42, .07);
      --rule: rgba(23, 32, 42, .16);
      --heavy: rgba(23, 32, 42, .62);
      --red: #c6543d;
      --red-soft: rgba(198, 84, 61, .12);
      --blue: #1f6f8b;
      --blue-soft: rgba(31, 111, 139, .12);
      --cyan: #28a6b7;
      --cyan-soft: rgba(40, 166, 183, .12);
      --olive: #627d43;
      --olive-soft: rgba(98, 125, 67, .12);
      --gold: #b4872e;
      --gold-soft: rgba(180, 135, 46, .14);
      --violet: #7762a8;
      --violet-soft: rgba(119, 98, 168, .12);
      --card-shadow: 0 18px 42px rgba(18, 25, 38, .10);
      --font-display: "Noto Sans SC", sans-serif;
      --font-body: "Noto Sans SC", sans-serif;
      --font-mono: "IBM Plex Mono", monospace;
      --ease-out-expo: cubic-bezier(.16, 1, .3, 1);
      --duration-normal: .38s;
    }

    /* ===========================================
       BASE RESET
       =========================================== */
    * { box-sizing: border-box; }
    body { color: var(--ink); font-family: var(--font-body); }
    button { font-family: inherit; }

    /* ===========================================
       FIXED 16:9 STAGE: MANDATORY BASE STYLES
       Include this ENTIRE file in every presentation.
       Slides are authored at 1920×1080 and scaled as a whole.
       =========================================== */

    /* 1. Lock the browser viewport */
    html,
    body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--stage-bg, #000);
    }

    /* 2. Full-window deck viewport */
    .deck-viewport {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: var(--stage-bg, #000);
    }

    /* 3. Fixed 16:9 design canvas.
       JavaScript sets transform: translate(...) scale(...). */
    .deck-stage {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        transform-origin: 0 0;
        background: var(--slide-bg, #fff);
    }

    /* 4. Slides stack inside the fixed stage.
       Content must be laid out at 1920×1080, not reflowed per device. */
    .slide {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        display: block;
        visibility: hidden;
        opacity: 0;
        pointer-events: none;
        background: var(--slide-bg, #fff);
    }

    .slide.active,
    .slide.visible {
        visibility: visible;
        opacity: 1;
        pointer-events: auto;
        z-index: 1;
    }

    /* 5. Keep media inside authored slide bounds */
    img,
    video,
    canvas,
    svg {
        max-width: 100%;
        max-height: 100%;
    }

    /* 6. Print one fixed-size slide per page */
    @media print {
        html,
        body {
            width: 1920px;
            height: auto;
            overflow: visible;
            background: #fff;
        }

        .deck-viewport {
            position: static;
            overflow: visible;
            background: #fff;
        }

        .deck-stage {
            position: static;
            width: auto;
            height: auto;
            transform: none !important;
            background: none;
        }

        .slide {
            position: relative;
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
            pointer-events: auto !important;
            width: 1920px;
            height: 1080px;
            break-after: page;
            page-break-after: always;
        }

        .slide:last-child {
            break-after: auto;
            page-break-after: auto;
        }

    }

    /* 7. Reduced motion */
    @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
            animation-duration: 0.01ms !important;
            transition-duration: 0.2s !important;
        }
    }

    /* ===========================================
       REPORT STAGE
       =========================================== */
    .deck-stage {
      box-shadow: 0 30px 90px rgba(0, 0, 0, .38);
    }

    .slide {
      padding: 74px 92px;
      background:
        linear-gradient(118deg, transparent 0 62%, rgba(40,166,183,.10) 62% 64%, transparent 64% 100%),
        linear-gradient(24deg, transparent 0 70%, rgba(180,135,46,.10) 70% 72%, transparent 72% 100%),
        linear-gradient(90deg, rgba(23,32,42,.045) 0 1px, transparent 1px 100%),
        linear-gradient(0deg, rgba(23,32,42,.035) 0 1px, transparent 1px 100%),
        linear-gradient(180deg, #f9fbf4, #edf2ea);
      background-size: auto, auto, 80px 80px, 80px 80px, auto;
    }

    .slide.reverse {
      --slide-bg: #f4f7f1;
      --ink: #17202a;
      --muted: #59636f;
      --rule: rgba(23, 32, 42, .16);
      --heavy: rgba(23, 32, 42, .62);
      color: var(--ink);
      background:
        linear-gradient(116deg, transparent 0 56%, rgba(40,166,183,.13) 56% 58%, transparent 58% 100%),
        linear-gradient(28deg, transparent 0 70%, rgba(198,84,61,.09) 70% 72%, transparent 72% 100%),
        linear-gradient(90deg, rgba(23,32,42,.045) 0 1px, transparent 1px 100%),
        linear-gradient(0deg, rgba(23,32,42,.035) 0 1px, transparent 1px 100%),
        linear-gradient(180deg, #f9fbf4, #edf2ea);
      background-size: auto, auto, 80px 80px, 80px 80px, auto;
    }

    .slide::before {
      content: "";
      position: absolute;
      left: 92px;
      right: 92px;
      top: 48px;
      height: 2px;
      background: linear-gradient(90deg, var(--module-color, var(--blue)) 0 160px, var(--rule) 160px 100%);
    }

    .slide::after {
      content: attr(data-folio);
      position: absolute;
      right: 92px;
      top: 48px;
      color: var(--muted);
      font: 600 17px/1 var(--font-mono);
      letter-spacing: 0;
      background: color-mix(in srgb, var(--slide-bg) 86%, transparent);
      border: 1px solid var(--rule);
      padding: 9px 12px;
      text-align: right;
    }

    .slide.reverse::after { color: var(--muted); }

    /* ===========================================
       TYPOGRAPHY
       =========================================== */
    h1, h2, h3, p { margin: 0; }
    h1, h2 { font-family: var(--font-display); letter-spacing: 0; }
    h1 { font-size: 92px; line-height: 1.06; font-weight: 800; }
    h2 { font-size: 62px; line-height: 1.32; font-weight: 800; max-width: 1380px; min-height: 90px; }
    h3 { font-size: 32px; line-height: 1.2; font-weight: 700; }
    p, li { font-size: 26px; line-height: 1.46; }
    .lead { color: var(--muted); font-size: 30px; line-height: 1.45; max-width: 1240px; margin-top: 22px; }
    .slide-5 .lead,
    .slide-10 .lead,
    .slide-12 .lead { max-width: none; white-space: nowrap; }
    .reverse .lead, .reverse .muted { color: var(--muted); }
    .label {
      display: inline-block;
      color: var(--blue);
      font: 800 18px/1 var(--font-body);
      letter-spacing: 0;
      border: 1px solid color-mix(in srgb, currentColor 36%, transparent);
      border-left: 8px solid currentColor;
      padding: 10px 14px 10px 13px;
      background: color-mix(in srgb, currentColor 9%, transparent);
      margin-bottom: 22px;
    }
    .reverse .label { background: color-mix(in srgb, var(--blue) 9%, transparent); color: var(--blue); }
    .mono { font-family: var(--font-mono); }
    .red { color: var(--red); }
    .blue { color: var(--blue); }
    .module-bar {
      position: absolute;
      left: 92px;
      top: 48px;
      z-index: 4;
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font: 600 17px/1 var(--font-body);
      background: color-mix(in srgb, var(--slide-bg) 86%, transparent);
      border: 1px solid var(--rule);
      border-left: 8px solid var(--module-color, var(--blue));
      padding: 9px 14px 9px 12px;
    }
    .module-index {
      color: var(--blue);
      font: 700 16px/1 var(--font-mono);
    }
    .module-title { color: var(--ink); }
    .module-pages {
      color: var(--muted);
      font: 600 15px/1 var(--font-mono);
    }
    .module-1 { --module-color: #1f6f8b; }
    .module-2 { --module-color: #627d43; }
    .module-3 { --module-color: #b4872e; }
    .module-4 { --module-color: #7762a8; }
    .module-5 { --module-color: #c6543d; }
    .module-1 .module-index,
    .module-2 .module-index,
    .module-3 .module-index,
    .module-4 .module-index,
    .module-5 .module-index {
      color: var(--module-color);
    }
    .module-1 .quote,
    .module-2 .quote,
    .module-3 .quote,
    .module-4 .quote,
    .module-5 .quote {
      border-left-color: var(--module-color);
    }
    .module-1 .agenda-num, .module-2 .agenda-num, .module-3 .agenda-num, .module-4 .agenda-num, .module-5 .agenda-num {
      color: var(--module-color);
    }

    /* ===========================================
       ANIMATIONS
       =========================================== */
    .reveal {
      opacity: 0;
      transform: translateY(14px);
      transition: opacity var(--duration-normal) var(--ease-out-expo),
                  transform var(--duration-normal) var(--ease-out-expo);
    }

    .slide.visible .reveal {
      opacity: 1;
      transform: translateY(0);
    }

    .reveal:nth-child(1),
    .reveal:nth-child(2),
    .reveal:nth-child(3),
    .reveal:nth-child(4),
    .reveal:nth-child(5) {
      transition-delay: 0s;
    }

    /* ===========================================
       LAYOUT SYSTEM
       =========================================== */
    .frame {
      position: relative;
      z-index: 2;
      height: 100%;
      display: grid;
      gap: 38px;
    }
    .title-frame { grid-template-columns: 1.05fr .95fr; align-items: center; gap: 70px; }
    .cover-frame {
      align-content: center;
      justify-items: center;
      text-align: center;
    }
    .cover-frame > div { transform: translateY(-80px); }
    .cover-frame h1 {
      max-width: none;
      white-space: nowrap;
      font-size: 82px;
    }
    .cover-speaker {
      color: var(--muted);
      font: 700 32px/1.2 var(--font-body);
      margin-top: 28px;
    }
    .thanks-frame {
      align-content: center;
      justify-items: center;
      text-align: center;
    }
    .thanks-frame h1 {
      font-size: 132px;
      line-height: 1;
      font-weight: 800;
    }
    .stack-frame { grid-template-rows: auto 1fr; }
    .split-frame { grid-template-columns: .9fr 1.1fr; align-items: stretch; gap: 48px; }
    .center-frame { align-content: center; gap: 32px; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
    .four { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
    .five { display: grid; grid-template-columns: repeat(5, 1fr); gap: 18px; }
    .summary-points { display: grid; gap: 16px; margin-top: 34px; }
    .summary-points .tile { min-height: 128px; }
    .summary-map {
      display: grid;
      grid-template-columns: 1.12fr .88fr;
      grid-template-rows: auto 1fr auto;
      gap: 20px 24px;
      align-items: stretch;
    }
    .summary-node {
      position: relative;
      border: 1px solid var(--rule);
      background: rgba(252,255,247,.84);
      box-shadow: var(--card-shadow);
      padding: 22px 26px;
      overflow: hidden;
    }
    .summary-node::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 7px;
      height: 100%;
      background: var(--summary-accent, var(--blue));
    }
    .summary-node strong {
      display: block;
      font: 900 31px/1.16 var(--font-body);
      margin-bottom: 9px;
      color: var(--ink);
    }
    .summary-node span {
      color: var(--muted);
      font-size: 22px;
      line-height: 1.34;
    }
    .summary-protocol {
      grid-column: 1 / -1;
      --summary-accent: var(--blue);
      background: linear-gradient(90deg, rgba(31,111,139,.15), rgba(252,255,247,.88) 54%, rgba(98,125,67,.10));
      min-height: 118px;
    }
    .summary-server {
      grid-column: 1;
      --summary-accent: var(--cyan);
      background: linear-gradient(180deg, rgba(40,166,183,.13), rgba(252,255,247,.88) 44%);
      min-height: 318px;
      padding-bottom: 24px;
    }
    .summary-gateway {
      grid-column: 2;
      --summary-accent: var(--gold);
      background: linear-gradient(180deg, rgba(180,135,46,.16), rgba(252,255,247,.88) 48%);
      min-height: 318px;
    }
    .summary-capabilities {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 16px;
    }
    .summary-capability-title {
      display: inline-block;
      margin-top: 24px;
      padding: 8px 12px;
      border: 1px solid rgba(40,166,183,.32);
      background: rgba(40,166,183,.10);
      color: var(--blue);
      font: 800 18px/1 var(--font-body);
    }
    .summary-capability {
      border: 1px solid rgba(40,166,183,.28);
      background: rgba(252,255,247,.76);
      padding: 18px 16px;
      min-height: 138px;
    }
    .summary-capability strong {
      font-size: 24px;
      line-height: 1.14;
      margin-bottom: 8px;
    }
    .summary-capability span {
      font-size: 19px;
      line-height: 1.32;
    }
    .summary-capability.tools { border-color: rgba(31,111,139,.34); background: rgba(40,166,183,.11); }
    .summary-capability.resources { border-color: rgba(98,125,67,.34); background: rgba(98,125,67,.11); }
    .summary-capability.prompts { border-color: rgba(180,135,46,.38); background: rgba(180,135,46,.12); }
    .summary-map .quote {
      grid-column: 1 / -1;
      margin-top: 0;
    }

    /* ===========================================
       DOCUMENT COMPONENTS
       =========================================== */
    .sheet, .tile, .stamp, .quote, .table, .ledger {
      border: 1px solid var(--rule);
      background: rgba(252,255,247,.80);
      box-shadow: var(--card-shadow);
      backdrop-filter: blur(8px);
    }
    .reverse .sheet, .reverse .tile, .reverse .stamp, .reverse .quote, .reverse .table, .reverse .ledger {
      border-color: var(--rule);
      background: rgba(252,255,247,.82);
      box-shadow: var(--card-shadow);
    }
    .sheet { padding: 30px; }
    .tile {
      position: relative;
      padding: 28px;
      min-height: 164px;
      overflow: hidden;
    }
    .tile::before, .sheet::before, .table::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 5px;
      background: linear-gradient(90deg, var(--module-color, var(--blue)), transparent);
    }
    .sheet, .table { position: relative; overflow: hidden; }
    .tile strong, .stamp strong {
      display: block;
      font-size: 30px;
      line-height: 1.22;
      margin-bottom: 12px;
    }
    .tile span, .stamp span {
      display: block;
      color: var(--muted);
      font-size: 23px;
      line-height: 1.38;
    }
    .reverse .tile span, .reverse .stamp span { color: var(--muted); }
    .quote {
      padding: 34px 38px;
      border-left: 8px solid var(--blue);
      font: 700 34px/1.42 var(--font-display);
      background: rgba(252,255,247,.80);
    }
    .list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 14px;
    }
    .list li {
      display: grid;
      grid-template-columns: 38px 1fr;
      color: var(--muted);
      align-items: start;
    }
    .reverse .list li { color: var(--muted); }
    .list li::before {
      content: "";
      width: 7px;
      height: 7px;
      margin-top: 15px;
      background: var(--module-color, var(--blue));
      box-shadow: 0 0 0 6px color-mix(in srgb, var(--module-color, var(--blue)) 12%, transparent);
    }
    .ribbon {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .tag {
      border: 1px solid var(--rule);
      background: rgba(252,255,247,.78);
      padding: 12px 15px;
      font: 600 20px/1 var(--font-body);
      color: var(--ink);
    }
    .reverse .tag { color: var(--ink); border-color: var(--rule); background: rgba(252,255,247,.78); }

    .case-layout {
      display: grid;
      grid-template-columns: .86fr 1.14fr;
      gap: 34px;
      align-items: stretch;
    }
    .case-flow {
      display: grid;
      gap: 15px;
      align-content: start;
    }
    .case-node {
      border: 1px solid var(--rule);
      background: rgba(252,255,247,.86);
      box-shadow: var(--card-shadow);
      padding: 21px 24px;
      position: relative;
    }
    .case-node::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 7px;
      height: 100%;
      background: var(--module-color, var(--blue));
    }
    .case-node strong {
      display: block;
      font: 800 28px/1.2 var(--font-body);
      margin-bottom: 8px;
    }
    .case-node span {
      color: var(--muted);
      font-size: 21px;
      line-height: 1.35;
    }
    .case-arrow {
      color: var(--module-color, var(--blue));
      font: 800 24px/1 var(--font-mono);
      text-align: center;
    }
    .mapping-grid {
      display: grid;
      grid-template-columns: 1.04fr .96fr;
      grid-template-rows: repeat(6, minmax(58px, 1fr));
      gap: 13px;
    }
    .mapping-card {
      border: 1px solid var(--rule);
      background: rgba(252,255,247,.82);
      padding: 19px 21px;
      min-height: 132px;
      box-shadow: var(--card-shadow);
      position: relative;
      overflow: hidden;
    }
    .mapping-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 5px;
      background: linear-gradient(90deg, var(--module-color, var(--blue)), transparent);
    }
    .mapping-card::after {
      position: absolute;
      right: 14px;
      top: 12px;
      padding: 5px 8px;
      border: 1px solid currentColor;
      background: rgba(252,255,247,.74);
      font: 800 11px/1 var(--font-mono);
      letter-spacing: .08em;
    }
    .mapping-card.mapping-tool {
      grid-column: 1;
      border-color: rgba(31,111,139,.35);
      background: linear-gradient(180deg, rgba(40,166,183,.13), rgba(252,255,247,.86) 58%);
    }
    .mapping-card.mapping-tool:nth-child(1) { grid-row: 1 / span 2; }
    .mapping-card.mapping-tool:nth-child(2) { grid-row: 3 / span 2; }
    .mapping-card.mapping-tool:nth-child(3) { grid-row: 5 / span 2; }
    .mapping-card.mapping-tool::before { background: linear-gradient(90deg, var(--cyan), rgba(40,166,183,.08)); }
    .mapping-card.mapping-tool::after { content: "TOOL"; color: var(--blue); }
    .mapping-card.mapping-resource {
      grid-column: 2;
      grid-row: 1 / span 3;
      border-color: rgba(98,125,67,.38);
      background: linear-gradient(180deg, rgba(98,125,67,.16), rgba(252,255,247,.88) 56%);
    }
    .mapping-card.mapping-resource::before { background: linear-gradient(90deg, var(--olive), rgba(98,125,67,.08)); }
    .mapping-card.mapping-resource::after { content: "RESOURCE"; color: var(--olive); }
    .mapping-card.mapping-prompt {
      grid-column: 2;
      grid-row: 4 / span 3;
      border-color: rgba(180,135,46,.44);
      background: linear-gradient(180deg, rgba(180,135,46,.18), rgba(252,255,247,.88) 58%);
    }
    .mapping-card.mapping-prompt::before { background: linear-gradient(90deg, var(--gold), rgba(180,135,46,.08)); }
    .mapping-card.mapping-prompt::after { content: "PROMPT"; color: var(--gold); }
    .mapping-card code {
      display: block;
      color: var(--ink);
      font: 700 20px/1.28 var(--font-mono);
      margin: 8px 0 11px;
      padding-right: 78px;
    }
    .mapping-card strong {
      display: block;
      font-size: 23px;
      line-height: 1.24;
      margin-bottom: 8px;
    }
    .mapping-card span {
      color: var(--muted);
      font-size: 21px;
      line-height: 1.34;
    }
    .code-layout {
      display: grid;
      grid-template-columns: .82fr 1.18fr;
      gap: 32px;
      align-items: stretch;
    }
    .code-pane {
      border: 1px solid var(--rule);
      background: rgba(23,32,42,.94);
      color: #f7f5e8;
      box-shadow: var(--card-shadow);
      padding: 28px;
      font: 600 20px/1.48 var(--font-mono);
      white-space: pre-wrap;
      overflow: hidden;
      min-height: 560px;
    }
    .code-pane .muted-code { color: #aeb8ba; }
    .setup-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .prompt-box {
      border: 1px solid var(--rule);
      background: rgba(252,255,247,.86);
      box-shadow: var(--card-shadow);
      padding: 28px;
      font-size: 25px;
      line-height: 1.42;
      color: var(--ink);
    }

    /* ===========================================
       DIAGRAMS
       =========================================== */
    .cover-map {
      position: relative;
      height: 700px;
      border: 1px solid var(--rule);
      background:
        linear-gradient(120deg, transparent 0 45%, rgba(40,166,183,.18) 45% 46%, transparent 46% 100%),
        linear-gradient(34deg, transparent 0 58%, rgba(198,84,61,.14) 58% 59%, transparent 59% 100%),
        linear-gradient(90deg, rgba(244,239,229,.10) 1px, transparent 1px),

    /* ===========================================
       SLIDE PRESENTATION CONTROLLER
       =========================================== */
    class SlidePresentation {
      constructor() {
        this.stage = document.getElementById("deckStage");
        this.indexKey = "mcp-webppt-manual-current";
        this.editKey = "mcp-webppt-manual-edits";
        this.renderSlides();
        this.slides = [...document.querySelectorAll(".slide")];
        this.restoreEdits();
        this.setupStageScale();
        this.setupNavigation();
        this.setupTouch();
        this.setupWheel();
        const requested = Number.parseInt(new URLSearchParams(location.search).get("slide") || "", 10);
        const stored = Number.parseInt(localStorage.getItem(this.indexKey) || "0", 10);
        this.show(Number.isFinite(requested) ? requested - 1 : stored);
      }

      renderSlides() {
        this.stage.innerHTML = slidesData.map((s, i) => {
          const body = templates[s.type](s);
          const module = getModule(i);
          const moduleBar = module
            ? `<div class="module-bar"><span class="module-index">模块 ${String(module.id).padStart(2, "0")}</span><span class="module-title">${esc(module.title)}</span><span class="module-pages">${esc(module.pages)}</span></div>`
            : "";
          const cls = `${s.reverse ? "slide reverse" : "slide"} slide-${i + 1}${module ? ` module-${module.id}` : ""}`;
          return `<section class="${cls}" data-folio="${esc(s.folio)}" aria-label="${i + 1}. ${esc(s.title || s.label || s.folio)}">${moduleBar}${body}</section>`;
        }).join("");
      }

      setupStageScale() {
        const scale = () => {
          const factor = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
          const x = (window.innerWidth - 1920 * factor) / 2;
          const y = (window.innerHeight - 1080 * factor) / 2;
          this.stage.style.transform = `translate(${x}px, ${y}px) scale(${factor})`;
        };
        scale();
        window.addEventListener("resize", scale);
      }

      setupNavigation() {
        document.addEventListener("keydown", (event) => {
          if (["ArrowRight", " ", "PageDown"].includes(event.key)) { event.preventDefault(); this.go(1); }
          if (["ArrowLeft", "PageUp"].includes(event.key)) { event.preventDefault(); this.go(-1); }
          if (event.key === "Home") { event.preventDefault(); this.show(0); }
          if (event.key === "End") { event.preventDefault(); this.show(this.slides.length - 1); }
        });
      }

      setupTouch() {
        let startX = 0, startY = 0;
        window.addEventListener("touchstart", (event) => {
          startX = event.changedTouches[0].clientX;
          startY = event.changedTouches[0].clientY;
        }, { passive: true });
        window.addEventListener("touchend", (event) => {
          const dx = event.changedTouches[0].clientX - startX;
          const dy = event.changedTouches[0].clientY - startY;
          if (Math.abs(dx) > 58 && Math.abs(dx) > Math.abs(dy)) this.go(dx < 0 ? 1 : -1);
        }, { passive: true });
      }

      setupWheel() {
        let locked = false;
        window.addEventListener("wheel", (event) => {
          if (locked || Math.abs(event.deltaY) < 30) return;
          locked = true;
          this.go(event.deltaY > 0 ? 1 : -1);
          setTimeout(() => locked = false, 440);
        }, { passive: true });
      }

      restoreEdits() {
        try {
          const edits = JSON.parse(localStorage.getItem(this.editKey) || "[]");
          document.querySelectorAll("[data-editable]").forEach((el, i) => {
            if (edits[i]) el.innerHTML = edits[i];
          });
        } catch (_) {}
      }

      show(index) {
        this.current = Math.max(0, Math.min(index, this.slides.length - 1));
        this.slides.forEach((slide, i) => {
          slide.classList.toggle("active", i === this.current);
          slide.classList.toggle("visible", i === this.current);
        });
        localStorage.setItem(this.indexKey, String(this.current));
      }

      go(delta) { this.show(this.current + delta); }
    }

    new SlidePresentation();
  </script>
